[project]
name = "firefly-bank-importer"
version = "0.1.2"
description = ""
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "firefly-python-api",
    "httpx>=0.28.1",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "uvicorn>=0.35.0",
]

[tool.uv.sources]
firefly-python-api = { path = "libs/firefly-python-api" }

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "mypy",
    "types-requests",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "coverage",
    "complexipy",
    "fastapi",
    "uvicorn",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
firefly-import = "firefly_bank_importer.import_firefly:main"
firefly-import-web = "firefly_bank_importer.web_ui:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pytest",
    "hypothesis",
    "hypothesis.strategies",
    "fastapi",
    "fastapi.responses",
    "fastapi.*",
    "uvicorn",
    "uvicorn.*",
    "fastapi.testclient",
    "fastapi.responses",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["firefly_bank_importer.web_ui"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["firefly_python_api", "firefly_python_api.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
targets = ["src"]
recursive = true
skips = []

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.9.0",
    "pymarkdownlnt>=0.9.36",
]
