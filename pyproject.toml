[project]
name = "firefly-bank-importer"
version = "0.1.1"
description = ""
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "mypy",
    "types-requests",
    "pytest",
    "pytest-cov",
    "coverage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
firefly-import = "firefly_bank_importer.import_firefly:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
