[project]
name = "firefly-bank-importer"
version = "0.1.0"
description = "Python tool for importing bank CSV exports into Firefly III, with automatic date filtering to avoid duplicate transactions."
requires-python = ">=3.11"
dependencies = [
    "firefly-python-api",
    "requests>=2.31",
    "tqdm>=4.66",
]

[tool.uv.sources]
firefly-python-api = { path = "libs/firefly-python-api" }

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "pymarkdownlnt>=0.9.36",
    "complexipy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "types-requests",
    "hypothesis",
    "coverage",
    "types-tqdm",
    "pip-audit",
    "pytest-bdd",
]

[project.scripts]
firefly-import = "firefly_bank_importer.import_firefly:main"
firefly-clear-transactions = "firefly_bank_importer.clear_transactions:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pytest",
    "hypothesis",
    "hypothesis.strategies",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["firefly_python_api", "firefly_python_api.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
targets = ["src"]
recursive = true
skips = []

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/bdd/features"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
