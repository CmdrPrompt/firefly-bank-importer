[project]
name = "firefly-bank-importer"
version = "0.1.0"
description = "Python tool for importing bank CSV exports into Firefly III, with automatic date filtering to avoid duplicate transactions."
requires-python = ">=3.11"
dependencies = []

project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "pymarkdownlnt>=0.9.36",
    "complexipy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "types-requests",
    "hypothesis",
    "coverage",
    "fastapi",
    "uvicorn",
    "httpx",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[tool.bandit]
skips = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
